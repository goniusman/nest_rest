version: "3.8"
services:
  # nginx:
  #   image: nginx:stable-alpine
  #   ports:
  #     - "5000:80"
  #   volumes: 
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   networks:
  #     - mynet
  nest:
    build:
      context: .
      dockerfile: Dockerfile
    image: nest
    container_name: rest
    ports:
      - "5000:5000"
    networks:
      - mynet
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://172.17.0.1
      - MONGODB_PORT=27018
    env_file:
      - ./.env
    depends_on:
      - mongo
      # - redis
    volumes:
      - ./:/app
      - /app/node_modules
  admin:
    build:
      context: E:\JS\FullStack\pickbazar\admin
      dockerfile: E:\JS\FullStack\pickbazar\admin\Dockerfile
    image: admin:1.0.0
    container_name: admin
    ports:
      - "3002:3002"
    networks:
      - mynet
    environment:
      - PORT=3002
    env_file:
      - E:\JS\FullStack\pickbazar\admin\.env
    depends_on:
      - nest
      # - redis
  shop:
    build:
      context: E:\JS\FullStack\pickbazar\shop
      dockerfile: E:\JS\FullStack\pickbazar\shop\Dockerfile
    image: shop:1.0.0
    container_name: shop
    ports:
      - "3003:3003"
    networks:
      - mynet
    environment:
      - PORT=3003
    env_file:
      - E:\JS\FullStack\pickbazar\shop\.env
    depends_on:
      - nest
      # - redis
  mongo:
    image: mongo:latest
    container_name: mongodb
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=osman
    #   - MONGO_INITDB_ROOT_PASSWORD=goni
    ports:
      - "27018:27017"
    networks:
      - mynet
    volumes:
      - mongovol:/data/db
  # redis:
  #   image: redis
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - mynet
  #   volumes:
  #     - redisvol:/data/db
volumes:
  mongovol:
  # redisvol:
networks:
  mynet:
    driver: bridge
