version: "3.8"
services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    depends_on:
      - nest
    #   - admin
    ports:
      - "5000:80"
    volumes: 
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mynet
    # restart: on-failure
  nest:
    build:
      context: .
      dockerfile: Dockerfile
    # image: nest
    container_name: rest
    # ports:
    #   - "5000:5000"
    networks:
      - mynet
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo
      - MONGODB_PORT=27017 
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - ./.env
    depends_on:
      - mongo
      - redis
    volumes:
      - nodesvol:/app/node_modules
      - ./:/app
      # - type: bind
      #   source: './'
      #   target: '/app'
      # - type: volume
      #   source: nodesvol
      #   target: /app/node_modules
  admin:
    build:
      context: ..\admin
      dockerfile: ..\admin\Dockerfile
    # image: admin:1.0.0
    container_name: admin
    ports:
      - "3002:3002"
    networks:
      - mynet
    environment:
      - PORT=3002
      - NEXT_PUBLIC_REST_API_ENDPOINT=http://localhost:5000/api
    env_file:
      - ..\admin\.env
    depends_on:
      - nest
      - redis
    # volumes:
    #   - ../admin:/app
    #   - /app/node_modules
  
  shop:
    build:
      context: ..\shop
      dockerfile: ..\shop\Dockerfile
    # image: shop:1.0.0
    container_name: shop
    ports:
      - "3003:3003"
    networks:
      - mynet
    environment:
      - PORT=3003
      - NEXT_PUBLIC_REST_API_ENDPOINT=http://nginx:5000/api
      - NEXT_PUBLIC_REST_API_ENDPOINT=http://nginx:80/api
    env_file:
      - ..\shop\.env
    depends_on:
      - nest
      - admin
  #     # - redis
  # #   # volumes:
  # #   #   - ../shop:/app
  # #   #   - /app/node_modules
  mongo:
    image: mongo:latest
    container_name: mongodb
    # environment:
    #   - MONGO_INITDB_ROOT_USERNAME=osman
    #   - MONGO_INITDB_ROOT_PASSWORD=goni
    ports:
      - "27018:27017"
    networks:
      - mynet
    volumes:
        # mongovol:/data/db
      # - type: bind
      #   source: 'J:/composemongo'
      #   target: '/data/db'
      - type: volume
        source: mongovol
        target: /data/db
  redis:
    image: redis
    container_name: redis
    ports:
      - "6378:6379"
    networks:
      - mynet
    volumes:
      - redisvol:/data/db

volumes:
  mongovol:
  redisvol:
  nodesvol:
  #  external: true
networks:
  mynet:
    driver: bridge
    # external: true
