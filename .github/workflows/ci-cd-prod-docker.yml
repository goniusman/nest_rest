name: CI/CD to Production

on:
  push:
    branches:
      - production

jobs:
  ci-cd:
    name: Build and Deploy to Production
    runs-on: [self-hosted, production, backend, rest]

    steps:
      # - name: Fix permissions for Loki data directories
      #   run: |
      #     sudo chown -R $USER:$USER ./loki || true
      #     sudo chmod -R 775 ./loki || true

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fix permissions on GitHub workspace
        run: |
          sudo chown -R $USER:$USER $GITHUB_WORKSPACE
          sudo chmod -R 777 $GITHUB_WORKSPACE
      
      # - name: Prepare Loki directories with correct permissions
      #   run: | 
      #     mkdir -p ./loki/{wal,index,chunks,cache,compactor/deletion}
      #     USERNAME=$(whoami)
      #     sudo chown -R $USERNAME:$USERNAME ./loki
      #     sudo chmod -R 777 ./loki

      
      - name: Set dynamic image tag
        run: echo "IMAGE_TAG=production-$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      - name: Prepare Docker cache
        run: mkdir -p /tmp/.buildx-cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --network=host -t prometheus .

      - name: Build new app image
        run: |
          docker buildx build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache,mode=max \
            --load \
            -t rest_bazar:$IMAGE_TAG -f Dockerfile .

          # SERVICES=("redis" "elasticsearch" "grafana" "prometheus" "kibana" "logstash")
      
      # - name: Start infrastructure if not already running
      #   run: |
      #       SERVICES=("redis" "grafana" "prometheus" "loki" "promtail" "redis_exporter")
      #       FILE="docker-compose.infra.yml"
      #       PROJECT="seenyor"
            
      #       for SERVICE in "${SERVICES[@]}"; do
      #         CONTAINER_NAME="${PROJECT}_${SERVICE}_1"
      #         if docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" | grep -q "$CONTAINER_NAME"; then
      #           echo "$SERVICE is already running. Skipping..."
      #           # Do nothing or you could optionally run:
      #           # docker compose -f $FILE -p $PROJECT start $SERVICE
      #         else
      #           echo "$SERVICE is not running. Starting..."
      #           docker compose -f $FILE -p $PROJECT up -d $SERVICE
      #         fi
      #       done


      - name: Make deployment scripts executable
        run: chmod +x ./deploy-blue-green-prod.sh ./nginx/entrypoint.sh

      - name: Run Blue-Green Deployment
        run: |
          echo "Deploying app with image tag: $IMAGE_TAG"
          export IMAGE_TAG=$IMAGE_TAG
          ./deploy-blue-green-prod.sh

      - name: Confirm deployed container is running
        run: docker ps | grep rest_bazar || echo "No active app container found" 

      - name: Prune old Docker images (keep latest 3)
        run: |
          docker images --format "{{.Repository}}:{{.Tag}} {{.CreatedAt}}" \
            | grep "^rest_bazar:production-" \
            | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi

      # - name: Prune stopped containers /// do not run this
      #   run: docker container prune -f

      - name: Prune dangling volumes
        run: docker volume prune -f

      - name: Prune unused networks
        run: docker network prune -f

      - name: Prune build cache layers
        run: docker builder prune -f

      - name: Prune dangling (untagged) images
        run: docker image prune -f

      # - name: Prune everything unused (safe for CI)
      #   run: docker system prune -af --volumes
      

