services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/entrypoint.sh:/docker-entrypoint.sh
    environment:
      - ACTIVE_APP=${ACTIVE_APP}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    ports:
      - "81:80"
    networks:
      - backend
    restart: unless-stopped

  rest_bazar_blue:
    image: rest_bazar:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - .env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULL_ADMIN_PASS=12345#
      - PORT=5000
    # depends_on:
    #   - redis
      # redis:
      #   condition: service_healthy  
    volumes:
      - rest_bazar-logs:/app/logs
    restart: always
    networks:
      - backend

  rest_bazar_green:
    image: rest_bazar:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    env_file:
      - .env.production
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULL_ADMIN_PASS=12345#
      - PORT=5000
    # depends_on:
    #   - redis
      # redis:
      #   condition: service_healthy
    volumes:
      - rest_bazar-logs:/app/logs
    restart: always
    networks:
      - backend

volumes:
  rest_bazar-logs:
    driver: local

networks:
  backend:
    driver: bridge